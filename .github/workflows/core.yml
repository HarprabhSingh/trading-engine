name: Core tests
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        config: [Release, Debug]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S feed_handler -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DENABLE_SANITIZERS=${{ matrix.config == 'Debug' && 'ON' || 'OFF' }}
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
